name: Build macOS

on:
  workflow_dispatch:
    inputs:
      private_repo:
        description: 'Private source repository (org/name)'
        required: true
        default: 'SYMBIOTYC/cy-cli'
      tag:
        description: 'Git tag or branch to build'
        required: true
        default: 'v0.1.5'

permissions:
  contents: write

jobs:
  build:
    name: Build macOS ${{ matrix.target }}
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            artifact: cy-aarch64-apple-darwin.dmg
            app_name: CY-CLI-arm64.app
          - target: x86_64-apple-darwin
            artifact: cy-x86_64-apple-darwin.dmg
            app_name: CY-CLI-intel.app

    steps:
      - name: Checkout private source code
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.inputs.private_repo }}
          ref: ${{ github.event.inputs.tag }}
          token: ${{ secrets.PAT_FOR_PRIVATE_REPO }}
          path: cy-cli-private

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          cache: true

      - name: Add Apple targets and std
        shell: bash
        run: |
          rustup default stable
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          rustup component add rust-std --target aarch64-apple-darwin
          rustup component add rust-std --target x86_64-apple-darwin
          rustup component add rust-src
          echo "=== Target list ==="
          rustup target list --installed
          echo "=== Component list ==="
          rustup component list --installed
          echo "=== x86_64 std check ==="
          ls -la ~/.rustup/toolchains/stable-x86_64-apple-darwin/lib/ 2>/dev/null || echo "x86_64 std not found"
          echo "=== aarch64 std check ==="
          ls -la ~/.rustup/toolchains/stable-aarch64-apple-darwin/lib/ 2>/dev/null || echo "aarch64 std not found"

      - name: Build release binary
        working-directory: cy-cli-private/.fundament/codex-rs
        run: cargo build --bin cy --release --target ${{ matrix.target }}

      - name: Package macOS .dmg
        run: |
          BIN="cy-cli-private/.fundament/codex-rs/target/${{ matrix.target }}/release/cy"
          APP_NAME="${{ matrix.app_name }}"
          DMG_NAME="${{ matrix.artifact }}"

          mkdir -p "$APP_NAME/Contents/MacOS"
          mkdir -p "$APP_NAME/Contents/Resources"

          cp "$BIN" "$APP_NAME/Contents/MacOS/cy"
          chmod +x "$APP_NAME/Contents/MacOS/cy"

          mkdir -p icon.iconset
          sips -z 16 16     cy-logo.png --out icon.iconset/icon_16x16.png
          sips -z 32 32     cy-logo.png --out icon.iconset/icon_16x16@2x.png
          sips -z 32 32     cy-logo.png --out icon.iconset/icon_32x32.png
          sips -z 64 64     cy-logo.png --out icon.iconset/icon_32x32@2x.png
          sips -z 128 128   cy-logo.png --out icon.iconset/icon_128x128.png
          sips -z 256 256   cy-logo.png --out icon.iconset/icon_128x128@2x.png
          sips -z 256 256   cy-logo.png --out icon.iconset/icon_256x256.png
          sips -z 512 512   cy-logo.png --out icon.iconset/icon_256x256@2x.png
          sips -z 512 512   cy-logo.png --out icon.iconset/icon_512x512.png
          sips -z 1024 1024 cy-logo.png --out icon.iconset/icon_512x512@2x.png
          iconutil -c icns icon.iconset
          cp icon.icns "$APP_NAME/Contents/Resources/icon.icns"
          rm -rf icon.iconset icon.icns

          cat > "$APP_NAME/Contents/Info.plist" << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key>
            <string>cy</string>
            <key>CFBundleIdentifier</key>
            <string>com.symbiotyc.cy-cli</string>
            <key>CFBundleName</key>
            <string>CY-CLI</string>
            <key>CFBundleDisplayName</key>
            <string>CY-CLI</string>
            <key>CFBundleVersion</key>
            <string>1.0.0</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleSignature</key>
            <string>????</string>
            <key>CFBundleIconFile</key>
            <string>icon.icns</string>
            <key>LSMinimumSystemVersion</key>
            <string>13.0</string>
            <key>NSHighResolutionCapable</key>
            <true/>
          </dict>
          </plist>
          EOF

          hdiutil create -volname "CY-CLI" -srcfolder "$APP_NAME" -ov -format UDZO "$DMG_NAME"
          echo "Created $DMG_NAME"
          ls -lh "$DMG_NAME"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}-dmg
          path: ${{ matrix.artifact }}
          retention-days: 90
