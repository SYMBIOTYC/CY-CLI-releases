name: Build and Release cy-cli

on:
  repository_dispatch:
    types: [release-build]

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            os: linux
            artifact: cy-x86_64-unknown-linux-gnu.tar.gz
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            os: linux
            artifact: cy-aarch64-unknown-linux-gnu.tar.gz
          - target: x86_64-apple-darwin
            runner: macos-latest
            os: macos
            artifact: cy-x86_64-apple-darwin.tar.gz
          - target: aarch64-apple-darwin
            runner: macos-latest
            os: macos
            artifact: cy-aarch64-apple-darwin.tar.gz
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            os: windows
            artifact: cy-x86_64-pc-windows-msvc.zip

    steps:
      - name: Checkout private source code
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.client_payload.private_repo }}
          ref: ${{ github.event.client_payload.tag }}
          token: ${{ secrets.PAT_FOR_PRIVATE_REPO }}
          path: cy-cli-private

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          cache: true

      - name: Build release binary
        working-directory: cy-cli-private/.fundament/codex-rs
        run: cargo build --bin cy --release --target ${{ matrix.target }}

      - name: Strip binary (non-Windows)
        if: matrix.os != 'windows'
        run: |
          strip cy-cli-private/.fundament/codex-rs/target/${{ matrix.target }}/release/cy || true
          upx --best --lzma cy-cli-private/.fundament/codex-rs/target/${{ matrix.target }}/release/cy || true

      - name: Package artifact
        shell: bash
        run: |
          BIN="cy-cli-private/.fundament/codex-rs/target/${{ matrix.target }}/release/cy"
          if [ "${{ matrix.os }}" = "windows" ]; then
            cp "$BIN.exe" cy.exe
            powershell Compress-Archive -Path cy.exe -DestinationPath ${{ matrix.artifact }}
          else
            cp "$BIN" cy
            tar czf ${{ matrix.artifact }} cy
          fi

      - name: Compute checksums
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "windows" ]; then
            powershell -Command "Get-FileHash -Algorithm SHA256 ${{ matrix.artifact }} | Select-Object -ExpandProperty Hash | Out-File -FilePath ${{ matrix.artifact }}.sha256"
          else
            sha256sum ${{ matrix.artifact }} > ${{ matrix.artifact }}.sha256
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}
            ${{ matrix.artifact }}.sha256
          retention-days: 90

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Package release assets
        shell: bash
        run: |
          mkdir -p release-assets
          cp artifacts/*/*.tar.gz release-assets/ 2>/dev/null || true
          cp artifacts/*/*.zip release-assets/ 2>/dev/null || true
          cp artifacts/*/*.sha256 release-assets/ 2>/dev/null || true

      - name: Generate checksums manifest
        shell: bash
        run: |
          cd release-assets
          sha256sum *.tar.gz *.zip > SHA256SUMS

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ github.event.client_payload.tag }}
          name: ${{ github.event.client_payload.tag }}
          generate_release_notes: true
          files: |
            release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
