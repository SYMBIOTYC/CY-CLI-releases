name: Build and Release cy-cli

on:
  repository_dispatch:
    types: [release-build]

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            os: linux
            artifact: cy-x86_64-unknown-linux-gnu.tar.gz
          - target: x86_64-apple-darwin
            runner: macos-13
            os: macos
            artifact: cy-x86_64-apple-darwin.dmg
            installer: cy-x86_64-apple-darwin.pkg

    steps:
      - name: Checkout private source code
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.client_payload.private_repo }}
          ref: ${{ github.event.client_payload.tag }}
          token: ${{ secrets.PAT_FOR_PRIVATE_REPO }}
          path: cy-cli-private

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          cache: true

      - name: Build release binary
        working-directory: cy-cli-private/.fundament/codex-rs
        run: cargo build --bin cy --release --target ${{ matrix.target }}

      - name: Strip binary
        run: |
          strip cy-cli-private/.fundament/codex-rs/target/${{ matrix.target }}/release/cy || true
          upx --best --lzma cy-cli-private/.fundament/codex-rs/target/${{ matrix.target }}/release/cy || true

      - name: Package macOS .dmg
        if: matrix.os == 'macos'
        run: |
          BIN="cy-cli-private/.fundament/codex-rs/target/${{ matrix.target }}/release/cy"
          APP_NAME="CY-CLI.app"
          DMG_NAME="${{ matrix.artifact }}"

          mkdir -p "$APP_NAME/Contents/MacOS"
          mkdir -p "$APP_NAME/Contents/Resources"

          cp "$BIN" "$APP_NAME/Contents/MacOS/cy"
          chmod +x "$APP_NAME/Contents/MacOS/cy"

          cat > "$APP_NAME/Contents/Info.plist" << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key>
            <string>cy</string>
            <key>CFBundleIdentifier</key>
            <string>com.symbiotyc.cy-cli</string>
            <key>CFBundleName</key>
            <string>CY-CLI</string>
            <key>CFBundleDisplayName</key>
            <string>CY-CLI</string>
            <key>CFBundleVersion</key>
            <string>1.0.0</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleSignature</key>
            <string>????</string>
            <key>CFBundleIconFile</key>
            <string>icon</string>
            <key>LSMinimumSystemVersion</key>
            <string>10.15</string>
            <key>NSHighResolutionCapable</key>
            <true/>
          </dict>
          </plist>
          EOF

          hdiutil create -volname "CY-CLI" -srcfolder "$APP_NAME" -ov -format UDZO "$DMG_NAME"
          echo "Created $DMG_NAME"
          ls -lh "$DMG_NAME"

      - name: Build macOS .pkg installer
        if: matrix.os == 'macos'
        run: |
          BIN="cy-cli-private/.fundament/codex-rs/target/${{ matrix.target }}/release/cy"
          WRAPPER="${{ github.workspace }}/tools/cy-wrapper.sh"
          VERSION="${{ github.event.client_payload.tag }}"
          VERSION="${VERSION#v}"
          PKG_NAME="${{ matrix.installer }}"

          STAGING=$(mktemp -d)
          trap "rm -rf $STAGING" EXIT

          # Staging layout: /usr/local/bin/cy (wrapper), /usr/local/lib/cy/bin/cy (binary)
          mkdir -p "$STAGING/usr/local/lib/cy/bin"
          mkdir -p "$STAGING/usr/local/bin"

          cp "$BIN" "$STAGING/usr/local/lib/cy/bin/cy"
          chmod +x "$STAGING/usr/local/lib/cy/bin/cy"

          cp "$WRAPPER" "$STAGING/usr/local/bin/cy"
          chmod +x "$STAGING/usr/local/bin/cy"

          # Postinstall
          cat > "$STAGING/postinstall" << 'POSTINSTALL'
          #!/bin/bash
          mkdir -p "$HOME/.local/bin" "$HOME/.local/share/cy/bin"
          if [ -f "$HOME/.local/share/cy/bin/cy" ]; then chmod +x "$HOME/.local/share/cy/bin/cy"; fi
          SHELL_RC="$HOME/.zshrc"
          [ -n "${BASH_VERSION-}" ] && SHELL_RC="$HOME/.bashrc"
          if ! grep -q '/usr/local/bin' "$SHELL_RC" 2>/dev/null; then
            echo '' >> "$SHELL_RC"
            echo '# Added by CY-CLI installer' >> "$SHELL_RC"
            echo 'export PATH="/usr/local/bin:$PATH"' >> "$SHELL_RC"
          fi
          echo "CY-CLI installed! Run: cy --version"
          POSTINSTALL
          chmod +x "$STAGING/postinstall"

          pkgbuild --root "$STAGING" --install-location "/" --scripts "$STAGING" \
            --identifier "com.symbiotyc.cy-cli" --version "$VERSION" \
            --compression latest "$STAGING/component.pkg"

          productbuild --distribution - --package-path "$STAGING" --version "$VERSION" "$PKG_NAME" << DISTEOF
          <?xml version="1.0" encoding="utf-8"?>
          <installer-gui-script minSpecVersion="2">
            <title>CY-CLI</title>
            <pkg-ref id="com.symbiotyc.cy-cli" version="$VERSION" auth="Root">component.pkg</pkg-ref>
            <choice id="default" title="CY-CLI">
              <pkg-ref id="com.symbiotyc.cy-cli"/>
            </choice>
            <options customize="never" require-scripts="true"/>
          </installer-gui-script>
          DISTEOF

          echo "Created $PKG_NAME"
          ls -lh "$PKG_NAME"
          shasum -a 256 "$PKG_NAME" > "$PKG_NAME.sha256"

      - name: Package Linux artifact
        if: matrix.os == 'linux'
        shell: bash
        run: |
          BIN="cy-cli-private/.fundament/codex-rs/target/${{ matrix.target }}/release/cy"
          cp "$BIN" cy
          tar czf ${{ matrix.artifact }} cy
          sha256sum ${{ matrix.artifact }} > ${{ matrix.artifact }}.sha256

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            ${{ matrix.artifact }}
            ${{ matrix.artifact }}.sha256
            ${{ matrix.installer }}
            ${{ matrix.installer }}.sha256
          retention-days: 90

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Package release assets
        shell: bash
        run: |
          mkdir -p release-assets
          cp artifacts/*/*.tar.gz release-assets/ 2>/dev/null || true
          cp artifacts/*/*.zip release-assets/ 2>/dev/null || true
          cp artifacts/*/*.dmg release-assets/ 2>/dev/null || true
          cp artifacts/*/*.pkg release-assets/ 2>/dev/null || true
          cp artifacts/*/*.exe release-assets/ 2>/dev/null || true
          cp artifacts/*/*.sha256 release-assets/ 2>/dev/null || true

      - name: Generate checksums manifest
        shell: bash
        run: |
          cd release-assets
          sha256sum *.tar.gz *.zip *.dmg *.pkg *.exe > SHA256SUMS

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ github.event.client_payload.tag }}
          name: ${{ github.event.client_payload.tag }}
          generate_release_notes: true
          files: |
            release-assets/*
