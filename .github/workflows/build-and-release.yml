name: Build and Release cy-cli

on:
  repository_dispatch:
    types: [release-build]

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            os: linux
            artifact: cy-x86_64-unknown-linux-gnu.tar.gz
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            os: linux
            artifact: cy-aarch64-unknown-linux-gnu.tar.gz
          - target: x86_64-apple-darwin
            runner: macos-latest
            os: macos
            artifact: cy-x86_64-apple-darwin.dmg
            installer: cy-x86_64-apple-darwin.pkg
          - target: aarch64-apple-darwin
            runner: macos-latest
            os: macos
            artifact: cy-aarch64-apple-darwin.dmg
            installer: cy-aarch64-apple-darwin.pkg
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            os: windows
            artifact: cy-x86_64-pc-windows-msvc.zip
            installer: CY-CLI-x86_64-setup.exe
          - target: aarch64-pc-windows-msvc
            runner: windows-latest
            os: windows
            artifact: cy-aarch64-pc-windows-msvc.zip
            installer: CY-CLI-aarch64-setup.exe

    steps:
      - name: Checkout private source code
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.client_payload.private_repo }}
          ref: ${{ github.event.client_payload.tag }}
          token: ${{ secrets.PAT_FOR_PRIVATE_REPO }}
          path: cy-cli-private

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          cache: true

      - name: Add target
        run: rustup target add ${{ matrix.target }}

      - name: Build release binary
        working-directory: cy-cli-private/.fundament/codex-rs
        run: cargo build --bin cy --release --target ${{ matrix.target }}

      - name: Strip binary (non-Windows)
        if: matrix.os != 'windows'
        run: |
          strip cy-cli-private/.fundament/codex-rs/target/${{ matrix.target }}/release/cy || true
          upx --best --lzma cy-cli-private/.fundament/codex-rs/target/${{ matrix.target }}/release/cy || true

      - name: Package macOS .dmg
        if: matrix.os == 'macos'
        run: |
          BIN="cy-cli-private/.fundament/codex-rs/target/${{ matrix.target }}/release/cy"
          APP_NAME="CY-CLI.app"
          DMG_NAME="${{ matrix.artifact }}"

          mkdir -p "$APP_NAME/Contents/MacOS"
          mkdir -p "$APP_NAME/Contents/Resources"

          cp "$BIN" "$APP_NAME/Contents/MacOS/cy"
          chmod +x "$APP_NAME/Contents/MacOS/cy"

          cat > "$APP_NAME/Contents/Info.plist" << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key>
            <string>cy</string>
            <key>CFBundleIdentifier</key>
            <string>com.symbiotyc.cy-cli</string>
            <key>CFBundleName</key>
            <string>CY-CLI</string>
            <key>CFBundleDisplayName</key>
            <string>CY-CLI</string>
            <key>CFBundleVersion</key>
            <string>1.0.0</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleSignature</key>
            <string>????</string>
            <key>CFBundleIconFile</key>
            <string>icon</string>
            <key>LSMinimumSystemVersion</key>
            <string>10.15</string>
            <key>NSHighResolutionCapable</key>
            <true/>
          </dict>
          </plist>
          EOF

          hdiutil create -volname "CY-CLI" -srcfolder "$APP_NAME" -ov -format UDZO "$DMG_NAME"
          echo "Created $DMG_NAME"
          ls -lh "$DMG_NAME"

      - name: Build macOS .pkg installer
        if: matrix.os == 'macos'
        run: |
          BIN="cy-cli-private/.fundament/codex-rs/target/${{ matrix.target }}/release/cy"
          WRAPPER="${{ github.workspace }}/tools/cy-wrapper.sh"
          VERSION="${{ github.event.client_payload.tag }}"
          VERSION="${VERSION#v}"
          PKG_NAME="${{ matrix.installer }}"

          STAGING=$(mktemp -d)
          trap "rm -rf $STAGING" EXIT

          # Staging layout: /usr/local/bin/cy (wrapper), /usr/local/lib/cy/bin/cy (binary)
          mkdir -p "$STAGING/usr/local/lib/cy/bin"
          mkdir -p "$STAGING/usr/local/bin"

          cp "$BIN" "$STAGING/usr/local/lib/cy/bin/cy"
          chmod +x "$STAGING/usr/local/lib/cy/bin/cy"

          cp "$WRAPPER" "$STAGING/usr/local/bin/cy"
          chmod +x "$STAGING/usr/local/bin/cy"

          # Postinstall
          cat > "$STAGING/postinstall" << 'POSTINSTALL'
          #!/bin/bash
          mkdir -p "$HOME/.local/bin" "$HOME/.local/share/cy/bin"
          if [ -f "$HOME/.local/share/cy/bin/cy" ]; then chmod +x "$HOME/.local/share/cy/bin/cy"; fi
          SHELL_RC="$HOME/.zshrc"
          [ -n "${BASH_VERSION-}" ] && SHELL_RC="$HOME/.bashrc"
          if ! grep -q '/usr/local/bin' "$SHELL_RC" 2>/dev/null; then
            echo '' >> "$SHELL_RC"
            echo '# Added by CY-CLI installer' >> "$SHELL_RC"
            echo 'export PATH="/usr/local/bin:$PATH"' >> "$SHELL_RC"
          fi
          echo "CY-CLI installed! Run: cy --version"
          POSTINSTALL
          chmod +x "$STAGING/postinstall"

          pkgbuild --root "$STAGING" --install-location "/" --scripts "$STAGING" \
            --identifier "com.symbiotyc.cy-cli" --version "$VERSION" \
            --compression latest "$STAGING/component.pkg"

          productbuild --distribution - --package-path "$STAGING" --version "$VERSION" "$PKG_NAME" << 'DISTEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <installer-gui-script minSpecVersion="2">
            <title>CY-CLI</title>
            <pkg-ref id="com.symbiotyc.cy-cli" version="$VERSION" auth="Root">component.pkg</pkg-ref>
            <choice id="default" title="CY-CLI">
              <pkg-ref id="com.symbiotyc.cy-cli"/>
            </choice>
            <options customize="never" require-scripts="true"/>
          </installer-gui-script>
          DISTEOF

          echo "Created $PKG_NAME"
          ls -lh "$PKG_NAME"
          shasum -a 256 "$PKG_NAME" > "$PKG_NAME.sha256"

      - name: Package Linux artifact
        if: matrix.os == 'linux'
        shell: bash
        run: |
          BIN="cy-cli-private/.fundament/codex-rs/target/${{ matrix.target }}/release/cy"
          cp "$BIN" cy
          tar czf ${{ matrix.artifact }} cy
          sha256sum ${{ matrix.artifact }} > ${{ matrix.artifact }}.sha256

      - name: Package Windows artifact
        if: matrix.os == 'windows'
        shell: bash
        run: |
          BIN="cy-cli-private/.fundament/codex-rs/target/${{ matrix.target }}/release/cy.exe"
          cp "$BIN" cy.exe
          powershell Compress-Archive -Path cy.exe -DestinationPath ${{ matrix.artifact }}
          powershell -Command "Get-FileHash -Algorithm SHA256 ${{ matrix.artifact }} | Select-Object -ExpandProperty Hash | Out-File -FilePath ${{ matrix.artifact }}.sha256"

      - name: Build Windows .exe installer
        if: matrix.os == 'windows'
        shell: bash
        run: |
          BIN="cy-cli-private/.fundament/codex-rs/target/${{ matrix.target }}/release/cy.exe"
          WRAPPER="${{ github.workspace }}/tools/cy-wrapper.ps1"
          INSTALLER="${{ matrix.installer }}"
          VERSION="${{ github.event.client_payload.tag }}"

          mkdir -p "${{ github.workspace }}/bin"
          cp "$BIN" "${{ github.workspace }}/bin/cy.exe"

          # Download Inno Setup and compile silently
          curl -fsSL -o is.exe https://files.jrsoftware.org/is/6/innosetup-6.2.2.exe
          mkdir -p "C:\Program Files (x86)\Inno Setup"
          powershell -Command "Start-Process is.exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/DIR=C:\Program Files (x86)\Inno Setup' -Wait"

          # Create license.txt
          echo "CY-CLI is licensed under the Apache License 2.0." > license.txt
          echo "See https://github.com/SYMBIOTYC/cy-cli/blob/main/LICENSE" >> license.txt

          # Generate Inno Setup script inline
          cat > installer.iss << ISSEOF
          ; CY-CLI Windows Installer
          #define MyAppName "CY-CLI"
          #define MyAppVersion "${{ github.event.client_payload.tag }}"
          #define MyAppPublisher "SYMBIOTYC"
          #define MyAppURL "https://github.com/SYMBIOTYC/cy-cli"
          #define MyAppExeName "cy-wrapper.ps1"

          [Setup]
          AppId={{A1B2C3D4-E5F6-7890-ABCD-EF1234567890}
          AppName={#MyAppName}
          AppVersion={#MyAppVersion}
          AppVerName={#MyAppName} {#MyAppVersion}
          AppPublisher={#MyAppPublisher}
          AppPublisherURL={#MyAppURL}
          AppSupportURL={#MyAppURL}
          AppUpdatesURL={#MyAppURL}
          DefaultDirName={localappdata}\Programs\{#MyAppName}
          DefaultGroupName={#MyAppName}
          DisableProgramGroupPage=yes
          LicenseFile=license.txt
          OutputDir=.
          OutputBaseFilename=${{ matrix.installer }}
          Compression=lzma2
          SolidCompression=yes
          WizardStyle=modern
          ArchitecturesInstallIn64BitMode=x64
          ArchitecturesAllowed=x64

          [Languages]
          Name: "english"; MessagesFile: "compiler:Default.isl"
          Name: "russian"; MessagesFile: "compiler:Languages\Russian.isl"

          [Files]
          Source: "bin\cy.exe"; DestDir: "{app}\bin"; Flags: ignoreversion
          Source: "cy-wrapper.ps1"; DestDir: "{app}"; Flags: ignoreversion

          [Icons]
          Name: "{group}\{#MyAppName}"; Filename: "{app}\cy-wrapper.ps1"
          Name: "{group}\{cm:UninstallProgram,{#MyAppName}}"; Filename: "{uninstallexe}"
          Name: "{autostartup}\{#MyAppName}"; Filename: "{app}\cy-wrapper.ps1"; Comment: "CY-CLI Self-Updating Wrapper"
          Name: "{commondesktop}\{#MyAppName}"; Filename: "{app}\cy-wrapper.ps1"; Tasks: desktopicon

          [Run]
          Filename: "powershell.exe"; Parameters: "-ExecutionPolicy Bypass -File ""{app}\cy-wrapper.ps1"" --version"; Description: "{cm:LaunchProgram,{#MyAppName}}"; Flags: nowait postinstall skipifsilent

          [Registry]
          Root: HKCU; Subkey: "Environment"; ValueType: expandsz; ValueName: "Path"; ValueData: "{olddata};{app}"; Flags: preservestringtype; Tasks: addtopath; Check: NeedsAddPath(ExpandConstant('{app}'))

          [Code]
          function NeedsAddPath(Path: string): Boolean;
          var
            OldPath: string;
          begin
            Result := False;
            if not RegQueryStringValue(HKCU, 'Environment', 'Path', OldPath) then
              Exit;
            Result := Pos(UpperCase(Path), Uppercase(OldPath)) = 0;
          end;
          ISSEOF

          # Compile installer
          "C:\Program Files (x86)\Inno Setup\ISCC.exe" installer.iss

          echo "Created $INSTALLER"
          ls -lh "$INSTALLER"
          powershell -Command "Get-FileHash -Algorithm SHA256 $INSTALLER | Select-Object -ExpandProperty Hash | Out-File -FilePath $INSTALLER.sha256"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            ${{ matrix.artifact }}
            ${{ matrix.artifact }}.sha256
            ${{ matrix.installer || '' }}
            ${{ matrix.installer || '' }}.sha256
          retention-days: 90

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Package release assets
        shell: bash
        run: |
          mkdir -p release-assets
          cp artifacts/*/*.tar.gz release-assets/ 2>/dev/null || true
          cp artifacts/*/*.zip release-assets/ 2>/dev/null || true
          cp artifacts/*/*.dmg release-assets/ 2>/dev/null || true
          cp artifacts/*/*.pkg release-assets/ 2>/dev/null || true
          cp artifacts/*/*.exe release-assets/ 2>/dev/null || true
          cp artifacts/*/*.sha256 release-assets/ 2>/dev/null || true

      - name: Generate checksums manifest
        shell: bash
        run: |
          cd release-assets
          sha256sum *.tar.gz *.zip *.dmg *.pkg *.exe > SHA256SUMS

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ github.event.client_payload.tag }}
          name: ${{ github.event.client_payload.tag }}
          generate_release_notes: true
          files: |
            release-assets/*
