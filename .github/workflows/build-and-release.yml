name: Build and Release cy-cli

on:
  repository_dispatch:
    types: [release-build]
  workflow_dispatch:
    inputs:
      private_repo:
        description: 'Private source repository (org/name)'
        required: true
        default: 'SYMBIOTYC/cy-cli'
      tag:
        description: 'Git tag or branch to build'
        required: true
        default: 'v0.1.5'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            os: linux
            artifact: cy-x86_64-unknown-linux-gnu.tar.gz
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            os: windows
            artifact: cy-x86_64-pc-windows-msvc.zip
            installer: CY-CLI-x86_64-setup.exe

    steps:
      - name: Checkout private source code
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.inputs.private_repo || github.event.client_payload.private_repo }}
          ref: ${{ github.event.inputs.tag || github.event.inputs.tag || github.event.client_payload.tag }}
          token: ${{ secrets.PAT_FOR_PRIVATE_REPO }}
          path: cy-cli-private

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          cache: true

      - name: Build release binary
        working-directory: cy-cli-private/.fundament/codex-rs
        run: cargo build --bin cy --release --target ${{ matrix.target }}

      - name: Strip binary (non-Windows)
        if: matrix.os != 'windows'
        run: |
          strip cy-cli-private/.fundament/codex-rs/target/${{ matrix.target }}/release/cy || true
          upx --best --lzma cy-cli-private/.fundament/codex-rs/target/${{ matrix.target }}/release/cy || true

      - name: Package Linux artifact
        if: matrix.os == 'linux'
        shell: bash
        run: |
          BIN="cy-cli-private/.fundament/codex-rs/target/${{ matrix.target }}/release/cy"
          cp "$BIN" cy
          tar czf ${{ matrix.artifact }} cy
          sha256sum ${{ matrix.artifact }} > ${{ matrix.artifact }}.sha256

      - name: Package Windows artifact
        if: matrix.os == 'windows'
        shell: bash
        run: |
          BIN="cy-cli-private/.fundament/codex-rs/target/${{ matrix.target }}/release/cy.exe"
          cp "$BIN" cy.exe
          powershell Compress-Archive -Path cy.exe -DestinationPath ${{ matrix.artifact }}
          powershell -Command "Get-FileHash -Algorithm SHA256 ${{ matrix.artifact }} | Select-Object -ExpandProperty Hash | Out-File -FilePath ${{ matrix.artifact }}.sha256"

      - name: Build Windows .exe installer
        if: matrix.os == 'windows'
        shell: bash
        run: |
          BIN="cy-cli-private/.fundament/codex-rs/target/${{ matrix.target }}/release/cy.exe"
          WRAPPER="${{ github.workspace }}/tools/cy-wrapper.ps1"
          INSTALLER="${{ matrix.installer }}"
          VERSION="${{ github.event.inputs.tag || github.event.client_payload.tag }}"
          VERSION="${VERSION#v}"

          mkdir -p "${{ github.workspace }}/bin"
          cp "$BIN" "${{ github.workspace }}/bin/cy.exe"

          curl -fsSL -o is.exe https://files.jrsoftware.org/is/6/innosetup-6.2.2.exe
          mkdir -p "C:\Program Files (x86)\Inno Setup"
          powershell -Command "Start-Process is.exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/DIR=C:\Program Files (x86)\Inno Setup' -Wait"

          echo "CY-CLI is licensed under the Apache License 2.0." > license.txt
          echo "See https://github.com/SYMBIOTYC/CY-CLI-releases/blob/main/LICENSE" >> license.txt

          cat > installer.iss << ISSEOF
          ; CY-CLI Windows Installer
          #define MyAppName "CY-CLI"
          #define MyAppVersion "$VERSION"
          #define MyAppPublisher "SYMBIOTYC"
          #define MyAppURL "https://github.com/SYMBIOTYC/CY-CLI-releases"
          #define MyAppExeName "cy-wrapper.ps1"

          [Setup]
          AppId={{A1B2C3D4-E5F6-7890-ABCD-EF1234567890}
          AppName={#MyAppName}
          AppVersion={#MyAppVersion}
          AppVerName={#MyAppName} {#MyAppVersion}
          AppPublisher={#MyAppPublisher}
          AppPublisherURL={#MyAppURL}
          AppSupportURL={#MyAppURL}
          AppUpdatesURL={#MyAppURL}
          DefaultDirName={localappdata}\Programs\{#MyAppName}
          DefaultGroupName={#MyAppName}
          DisableProgramGroupPage=yes
          LicenseFile=license.txt
          OutputDir=.
          OutputBaseFilename=${{ matrix.installer }}
          Compression=lzma2
          SolidCompression=yes
          WizardStyle=modern
          ArchitecturesInstallIn64BitMode=x64
          ArchitecturesAllowed=x64

          [Languages]
          Name: "english"; MessagesFile: "compiler:Default.isl"
          Name: "russian"; MessagesFile: "compiler:Languages\Russian.isl"

          [Files]
          Source: "bin\cy.exe"; DestDir: "{app}\bin"; Flags: ignoreversion
          Source: "cy-wrapper.ps1"; DestDir: "{app}"; Flags: ignoreversion

          [Icons]
          Name: "{group}\{#MyAppName}"; Filename: "{app}\cy-wrapper.ps1"
          Name: "{group}\{cm:UninstallProgram,{#MyAppName}}"; Filename: "{uninstallexe}"
          Name: "{autostartup}\{#MyAppName}"; Filename: "{app}\cy-wrapper.ps1"; Comment: "CY-CLI Self-Updating Wrapper"
          Name: "{commondesktop}\{#MyAppName}"; Filename: "{app}\cy-wrapper.ps1"; Tasks: desktopicon

          [Run]
          Filename: "powershell.exe"; Parameters: "-ExecutionPolicy Bypass -File ""{app}\cy-wrapper.ps1"" --version"; Description: "{cm:LaunchProgram,{#MyAppName}}"; Flags: nowait postinstall skipifsilent

          [Registry]
          Root: HKCU; Subkey: "Environment"; ValueType: expandsz; ValueName: "Path"; ValueData: "{olddata};{app}"; Flags: preservestringtype; Tasks: addtopath; Check: NeedsAddPath(ExpandConstant('{app}'))

          [Code]
          function NeedsAddPath(Path: string): Boolean;
          var
            OldPath: string;
          begin
            Result := False;
            if not RegQueryStringValue(HKCU, 'Environment', 'Path', OldPath) then
              Exit;
            Result := Pos(UpperCase(Path), Uppercase(OldPath)) = 0;
          end;
          ISSEOF

          "C:\Program Files (x86)\Inno Setup\ISCC.exe" installer.iss

          echo "Created $INSTALLER"
          ls -lh "$INSTALLER"
          powershell -Command "Get-FileHash -Algorithm SHA256 $INSTALLER | Select-Object -ExpandProperty Hash | Out-File -FilePath $INSTALLER.sha256"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            ${{ matrix.artifact }}
            ${{ matrix.artifact }}.sha256
            ${{ matrix.installer || '' }}
            ${{ matrix.installer || '' }}.sha256
          retention-days: 90

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Package release assets
        shell: bash
        run: |
          mkdir -p release-assets
          cp artifacts/*/*.tar.gz release-assets/ 2>/dev/null || true
          cp artifacts/*/*.zip release-assets/ 2>/dev/null || true
          cp artifacts/*/*.dmg release-assets/ 2>/dev/null || true
          cp artifacts/*/*.pkg release-assets/ 2>/dev/null || true
          cp artifacts/*/*.exe release-assets/ 2>/dev/null || true
          cp artifacts/*/*.sha256 release-assets/ 2>/dev/null || true

      - name: Generate checksums manifest
        shell: bash
        run: |
          cd release-assets
          sha256sum *.tar.gz *.zip *.dmg *.pkg *.exe > SHA256SUMS

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ github.event.inputs.tag || github.event.client_payload.tag }}
          name: ${{ github.event.inputs.tag || github.event.client_payload.tag }}
          generate_release_notes: true
          files: |
            release-assets/*
